{% extends "base.html" %}
{% block title %}Sign Up · Chatroom{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Create your account</h1>
  <p class="subtitle">It only takes a few seconds</p>

  <form method="POST" autocomplete="off">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autofocus>

    <label for="password">Password</label>
    <div class="password-field">
      <input type="password" id="password" name="password" required minlength="6">
      <button type="button" class="toggle-pw" data-target="password">Show</button>
    </div>

    <label for="confirm_password">Confirm Password</label>
    <div class="password-field">
      <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
      <button type="button" class="toggle-pw" data-target="confirm_password">Show</button>
    </div>

    <label class="checkbox-line">
      <input type="checkbox" id="show-all-pw"> Show passwords
    </label>

    <button type="submit" class="btn-primary">Sign Up</button>
  </form>

  <p class="switch-link">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
