{% extends "base.html" %}
{% block title %}Log In · Chatroom{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Welcome back</h1>
  <p class="subtitle">Log in to join or create a chatroom</p>

  <form method="POST" autocomplete="off">
    <input type="hidden" name="next" value="{{ next or '' }}">

    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autofocus>

    <label for="password">Password</label>
    <div class="password-field">
      <input type="password" id="password" name="password" required>
      <button type="button" class="toggle-pw" data-target="password">Show</button>
    </div>

    <button type="submit" class="btn-primary">Log In</button>
  </form>

  <p class="switch-link">Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></p>
</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
