{% extends "base.html" %}
{% block title %}Create Chatroom{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="top-row">
    <h1>Create a chatroom</h1>
    <a href="{{ url_for('logout') }}" class="logout-link">Log out</a>
  </div>
  <p class="subtitle">Signed in as <strong>{{ current_user.username }}</strong></p>

  <form method="POST" autocomplete="off">
    <label for="room_name">Chatroom name</label>
    <input type="text" id="room_name" name="room_name" placeholder="e.g. Weekend Hikers" required autofocus>

    <label for="max_members">Number of members allowed</label>
    <input type="number" id="max_members" name="max_members" min="2" value="10" required>

    <button type="submit" class="btn-primary">Create</button>
  </form>
</div>
{% endblock %}
